# ===================================
# BLOCKCHAIN CONFIGURATION
# ===================================

# RPC Endpoint - Connect to Ethereum node
# For local development: http://localhost:8545 (Ganache, Hardhat)
# For Goerli testnet: https://goerli.infura.io/v3/YOUR_PROJECT_ID
# For Sepolia testnet: https://sepolia.infura.io/v3/YOUR_PROJECT_ID
# For Mainnet: https://mainnet.infura.io/v3/YOUR_PROJECT_ID
blockchain.rpc-url=http://localhost:8545

# Private Key for transaction signing (optional)
# Remove or leave empty if using MetaMask for signing
# NEVER commit real private keys to version control!
# Use environment variables in production
blockchain.private-key=

# ===================================
# EXAMPLE DEPLOYED CONTRACTS
# ===================================
# Update these values after deploying your contracts

