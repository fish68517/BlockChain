# ===================================
# NOTES
# ===================================
# 1. For local development with Ganache:
#    - Start Ganache on port 8545
#    - Deploy contracts to Ganache
#    - Update contract addresses if needed
#
# 2. For testnet deployment:
#    - Get Infura project ID from https://infura.io
#    - Update blockchain.rpc-url with testnet endpoint
#    - Deploy contracts to testnet
#    - Fund accounts with testnet ETH
#
# 3. Environment Variables (Production):
#    - Set BLOCKCHAIN_RPC_URL environment variable
#    - Set BLOCKCHAIN_PRIVATE_KEY environment variable (if needed)
#
# 4. Security:
#    - NEVER hardcode private keys in production
#    - Use secure vaults (AWS Secrets Manager, HashiCorp Vault, etc.)
#    - Consider using hardware wallets or multi-sig wallets
