#
# https://docs.spring.io/spring-boot/docs/current/reference/htmlsingle/#common-application-properties
#
#server configuration
server.address=0.0.0.0
server.port=8090

cxf.path=/rest

# logging.level.org.jbpm.services.task.deadlines.notifications=debug
# logging.level.com.icegreen=trace

#kie server config
kieserver.serverId=business-application-service
kieserver.serverName=business-application-service
kieserver.location=http://localhost:8090/rest/server
#kieserver.controllers=


#kie server capabilities
kieserver.drools.enabled=true
kieserver.dmn.enabled=true
kieserver.jbpm.enabled=true
kieserver.jbpmui.enabled=true
kieserver.casemgmt.enabled=true
#kieserver.prometheus.enabled=true



#jbpm configuration
jbpm.executor.enabled=false
#jbpm.executor.retries=5
#jbpm.executor.interval=3
#jbpm.executor.threadPoolSize=1
#jbpm.executor.timeUnit=SECONDS


#data source configuration
spring.datasource.username=ccjbpmusr
spring.datasource.password=ccjbpmpass
spring.datasource.url=jdbc:mysql://localhost:3306/cc_jbpm_db?&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.jdbc.jdbc2.optional.MysqlXADataSource


#hibernate configuratio
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.entity-scan-packages=com.company.models*

#banner
spring.banner.location=classpath:banner.txt

springdoc.swagger-ui.path=/swagger-ui.html

narayana.transaction-manager-id=1
narayana.default-timeout=120
narayana.dbcp.enabled=true

# Thymeleaf configuration
spring.thymeleaf.prefix=classpath:/template/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# JWT configuration
collectorcoin.app.jwtSecret= CollectorCoinSecretKey
collectorcoin.app.jwtExpirationMs=86400000