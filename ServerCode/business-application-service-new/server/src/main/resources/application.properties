# ============ Server Configuration ============
server.port=8080
spring.application.name=collectorcoin-server

# Allow larger request body for image uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB

# ============ Database Configuration ============
spring.datasource.url=jdbc:mysql://localhost:3306/collectorcoin?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============ JPA Configuration ============
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============ Blockchain Configuration ============
# Local Hardhat node configuration
blockchain.node.url=http://localhost:8545
blockchain.contract.marketplace.address=0x5FbDB2315678afecb367f032d93F642f64180aa3
# Hardhat Account #0 private key (has 10000 ETH)
blockchain.admin.private-key=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
blockchain.chain.id=31337
blockchain.enabled=false

# ============ IPFS Configuration ============
ipfs.api.url=http://localhost:5001
ipfs.gateway.url=https://ipfs.io/ipfs/
ipfs.enabled=true
ipfs.mock.enabled=true

# ============ NFT Metadata Configuration ============
nft.metadata.base.image.url=ipfs://QmDefaultImageHash/default.jpg
nft.metadata.external.base.url=https://collectorcoin.com/listing/

# ============ User Configuration ============
user.initial.eth=1000.0

# ============ JBPM Configuration ============
jbpm.enabled=false
jbpm.deployment.id=com.collectorcoin:workflows:1.0.0

# ============ Logging Configuration ============
logging.level.com.collectorcoin=DEBUG
logging.level.org.web3j=INFO
logging.level.org.jbpm=INFO
